[package]
name = "typeasking"
version = "0.1.0"
edition = "2024"
description = "Typed, awaitable Jev evaluation requests for Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/ZENOTME/TypeAsking"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
wiremock = "0.6"
